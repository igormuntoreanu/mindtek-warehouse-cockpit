specVersion: "3.1"
metadata:
  name: mindtek.warehouse.cockpit
type: application
framework:
  name: SAPUI5
  version: "1.136.0"
  libraries:
    - name: sap.ui.core
    - name: sap.m
    - name: sap.f
    - name: sap.ui.layout
    - name: sap.suite.ui.microchart
    - name: themelib_sap_horizon
server:
  customMiddleware:
    - name: ui5-middleware-livereload
      afterMiddleware: compression
      configuration:
        extraExts: "xml,json,properties"
        watchPath: "webapp"
